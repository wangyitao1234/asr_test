name: Benchmark contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-corpus.txt
      - run: python -m unittest discover -s vllm -p 'test_*.py' -v
      - run: python -m unittest discover -s funasr -p 'test_*.py' -v
      - run: python -m compileall -q vllm funasr corpus
